<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="#060b12"/>
  <!-- Outer glow border -->
  <rect width="100" height="100" rx="22" fill="none" stroke="#00ffb4" stroke-width="3" opacity="0.4"/>
  <!-- Cursor / caret arrow — left side -->
  <polyline
    points="22 72  46 48  22 24"
    stroke="#00ffb4" stroke-width="8"
    fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Underscore / text line — right side -->
  <line
    x1="54" y1="78" x2="82" y2="78"
    stroke="#00ffb4" stroke-width="8" stroke-linecap="round"/>
  <!-- Blinking cursor dot -->
  <circle cx="82" cy="78" r="5" fill="#00b8ff" opacity="0.85"/>
</svg>
